name: Release

# Tag-driven release. The whole pipeline lives in desert-ant-core's reusable
# workflow, shared by every model SDK, so this file only names the version of it
# to use. See sdk-build/README.md in desert-ant-core for what ships when.
#
#   mise run set-version X.Y.Z && git tag vX.Y.Z && git push origin vX.Y.Z
#
# Publishes only what changed since the previous tag: the GitHub Release always,
# the Maven Central artifacts when Sources/ or packages/<model>-kotlin/ changed,
# and npm (with prebuilt natives for linux-x64, linux-arm64, darwin-arm64) when
# Sources/ or packages/<model>-node/ changed.
#
# A manual run dry-runs both build paths without publishing anything.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    uses: Desert-Ant-Labs/desert-ant-core/.github/workflows/model-sdk-release.yml@v0.5.3
    secrets: inherit
