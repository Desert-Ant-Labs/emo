# Build/test/publish for emo. The shared build/publish/version logic lives in
# desert-ant-core's model-SDK catalog (mise-tasks/model-sdk.toml, pinned below);
# this file supplies emo's config and its model-specific test tasks. See the
# catalog README for the full task list and the mise.local.toml secret setup.
[tools]
swift = "6.3.3"

[vars]
model = "emo"
product = "Emo"
tflite_files = "emo.tflite emo_meta.json emo_tokenizer.bin"

[env]
DAL_GPU = ""

[task_config]
includes = ["git::https://github.com/Desert-Ant-Labs/desert-ant-core.git//sdk-build/model-sdk.toml?ref=v0.5.1"]

# Test harnesses are model-specific, so they stay local (test-swift and
# test-android come from the catalog).
[tasks.test]
description = "Run every test suite (swift + web + node + android)"
depends = ["test-swift", "test-node", "test-web", "test-android"]

[tasks.test-node]
description = "Server-side Node test suite for packages/emo-node (native core via the emo_* C ABI)"
dir = "{{ config_root }}/packages/emo-node"
depends = ["node-natives"]
tools = { node = "22" }
run = """
set -euo pipefail
npm install --no-save --no-package-lock koffi@^2.9.0 >/dev/null 2>&1 || npm install >/dev/null 2>&1 || true
node --test test/emo.test.mjs test/browser-missing-litert.test.mjs
"""

[tasks.test-web]
description = "Headless-Chromium browser E2E for packages/emo-node (WebAssembly + LiteRT.js)"
dir = "{{ config_root }}/Examples/EmoWasmExample"
depends = ["build-web"]
tools = { node = "22" }
run = "npm install && npm run browser-example"

[tasks.test-android-firebase]
description = "Run the Android instrumented test on Firebase Test Lab (cloud devices; needs gcloud auth + a Firebase project)"
dir = "{{ config_root }}/packages/emo-kotlin"
run = "./run-firebase-test.sh"
